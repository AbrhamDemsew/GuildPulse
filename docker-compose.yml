version: "3.8"

services:
  guildpulse:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: guildpulse
    env_file:
      - .env
    environment:
      - PYTHONPATH=/app
    restart: unless-stopped
    stop_grace_period: 10s
    healthcheck:
      test: ["CMD", "python", "-c", "import sys; sys.exit(0)"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 5s
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    networks:
      - guildpulse-network
    labels:
      - "com.guildpulse.description=GuildPulse Discord community assistant"
      - "com.guildpulse.version=1.0.0"

networks:
  guildpulse-network:
    driver: bridge
